<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' file: 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<title>Μαθαίνω Μαθηματικά</title>
<style>
:root { --navy:#14213D; --ink2:#41507A; --paper:#FFFAEF; --card:#fff; --line:#E7DFC8; --soft:#F5EFDD;
        --yellow:#FFC933; --mint:#CFEBC9; --peach:#FFD9BF; }
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--paper); color:var(--navy); font-size:18px; line-height:1.5;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif; }
main { max-width:860px; margin:0 auto; padding:1.1rem 1rem 4rem; }
h1, h2, h3, p { margin-top:0; }
h2 { font-size:1.6rem; line-height:1.25; margin-bottom:.4rem; }
h3 { font-size:1.2rem; margin:1.6rem 0 .5rem; }
.muted { color:var(--ink2); font-size:.95rem; }
.sr { position:absolute; left:-9999px; }

/* Κεφαλίδα */
.top { display:flex; align-items:center; justify-content:space-between; gap:.8rem; margin-bottom:1rem; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:.8rem; min-width:0; flex:1 1 14rem; }
.logo { flex:none; width:58px; height:58px; }
.title { font-size:2rem; font-weight:800; line-height:1.12; margin:0; }
.title::after { content:""; display:block; width:54px; height:5px; border-radius:3px; background:var(--yellow); margin-top:.35rem; }
.subtitle { margin:.35rem 0 0; color:var(--ink2); font-size:1.05rem; }

/* Κουμπιά */
.btn { font:inherit; font-weight:700; min-height:3.2rem; padding:.55rem 1.2rem; border-radius:14px; border:2px solid var(--navy);
  background:#fff; color:var(--navy); cursor:pointer; box-shadow:0 4px 0 var(--navy); transition:transform .08s, box-shadow .08s; }
.btn:active { transform:translateY(3px); box-shadow:0 1px 0 var(--navy); }
.btn.primary { background:var(--yellow); }
.btn.block { display:block; width:100%; margin:.55rem 0 .8rem; }
.btn:disabled { opacity:.45; cursor:not-allowed; box-shadow:none; transform:none; }
.btn.small { white-space:nowrap; min-height:2.6rem; padding:.3rem .9rem; font-size:.95rem; box-shadow:0 3px 0 var(--navy); }
.btn.link { border-color:transparent; background:transparent; box-shadow:none; text-decoration:underline; min-height:2.6rem; padding:.3rem .6rem; }
.btn:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible { outline:3px solid var(--navy); outline-offset:3px; }
@media (prefers-reduced-motion:reduce) { .btn { transition:none; } }

/* Προφίλ */
.chips { display:flex; flex-wrap:wrap; gap:.6rem; margin:.4rem 0 1rem; }
.chip { font:inherit; font-weight:700; min-height:2.9rem; padding:.3rem 1.1rem; border-radius:999px; border:2px solid var(--navy);
  background:#fff; color:var(--navy); cursor:pointer; }
.chip[aria-pressed=true] { background:var(--navy); color:#fff; }
.chip.add { border-style:dashed; }
.chip:focus-visible { outline:3px solid var(--navy); outline-offset:3px; }
.panel { background:#fff; border:2px solid var(--navy); border-radius:20px; padding:1rem 1.2rem 1.1rem; margin:.8rem 0 1.2rem; }
label.lbl { display:block; font-weight:700; margin:.4rem 0 .3rem; }
input[type=text] { width:100%; min-height:3.1rem; font:inherit; color:var(--navy); background:#fff; border:2px solid var(--navy);
  border-radius:12px; padding:.4rem .8rem; }

/* Αρχική: κάρτες ενοτήτων */
.pill { display:inline-block; font-size:.9rem; font-weight:700; background:var(--soft); border:1.5px solid var(--navy);
  border-radius:999px; padding:.05rem .8rem; }
.grid { display:grid; grid-template-columns:1fr; gap:1.1rem; margin:1rem 0; }
@media (min-width:640px) { .grid { grid-template-columns:1fr 1fr; } }
.card { background:var(--card); border:2px solid var(--navy); border-radius:20px; padding:1.2rem 1.1rem 1.1rem; box-shadow:0 5px 0 var(--navy);
  position:relative; overflow:hidden; }
.card::before { content:""; position:absolute; left:0; right:0; top:0; height:11px; background:var(--tint); border-bottom:2px solid var(--navy); }
.card-head { display:flex; gap:.9rem; align-items:center; margin-top:.5rem; }
.badge { flex:none; width:3.5rem; height:3.5rem; border-radius:50%; background:var(--tint); border:2px solid var(--navy);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.45rem; }
.card h3 { margin:0; font-size:1.2rem; line-height:1.25; }
.card p { margin:0; }
.card-actions { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-top:1rem; }
.card-actions .btn { width:100%; padding-left:.3rem; padding-right:.3rem; }
.tags { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.9rem; }
.tag { font-size:.88rem; font-weight:700; background:var(--soft); border-radius:999px; padding:.1rem .75rem; }

/* Ερωτήσεις */
.runbar { display:flex; align-items:center; justify-content:space-between; gap:.6rem; margin-bottom:.4rem; }
.dots { display:flex; gap:.35rem; list-style:none; padding:0; margin:.5rem 0 .8rem; }
.dots li { flex:1; height:.7rem; border-radius:999px; background:var(--line); border:1.5px solid transparent; }
.dots li.done { background:var(--navy); }
.dots li.now { background:var(--yellow); border-color:var(--navy); }
.qcount { font-weight:700; color:var(--ink2); }
.prompt { font-size:1.6rem; line-height:1.4; font-weight:700; margin:.3rem 0 .8rem; }
fieldset { border:0; padding:0; margin:0; min-width:0; }
.opt { position:relative; display:flex; align-items:center; gap:.9rem; background:#fff; border:2px solid var(--navy); border-radius:16px;
  padding:.8rem 1rem; margin:.75rem 0; font-size:1.3rem; font-weight:600; cursor:pointer; box-shadow:0 3px 0 var(--navy); }
.opt input { position:absolute; opacity:0; pointer-events:none; }
.opt .let { flex:none; width:2.4rem; height:2.4rem; border-radius:50%; border:2px solid var(--navy); display:flex; align-items:center;
  justify-content:center; font-weight:800; background:var(--paper); font-size:1.1rem; }
.opt .note { margin-left:auto; font-size:.85rem; font-weight:700; text-align:right; padding-left:.5rem; }
.opt.selected { background:#FFF1BD; }
.opt.selected .let { background:var(--yellow); }
.opt.right { background:var(--mint); }
.opt.wrong { background:var(--peach); }
.opt.locked { cursor:default; }
.opt:focus-within { outline:3px solid var(--navy); outline-offset:3px; }
.feedback { border:2px solid var(--navy); border-radius:16px; padding:.9rem 1.1rem; margin:1.1rem 0 .6rem; background:var(--soft); }
.feedback.good { background:var(--mint); }
.feedback.bad { background:var(--peach); }
.feedback .verdict { font-weight:800; font-size:1.3rem; margin-bottom:.2rem; }

/* Αποτέλεσμα */
.bigscore { font-size:3.2rem; font-weight:800; line-height:1.1; margin:.2rem 0; }
.meter { display:flex; flex-wrap:wrap; gap:.4rem; margin:.6rem 0 1rem; }
.meter span { width:1.6rem; height:1.6rem; border-radius:50%; border:2px solid var(--navy); background:#fff; }
.meter span.on { background:var(--yellow); }
.review { list-style:none; padding:0; margin:.5rem 0; }
.review li { background:#fff; border:2px solid var(--line); border-radius:14px; padding:.7rem .9rem; margin:.6rem 0; }
.review .q { font-weight:700; }
details { background:#fff; border:2px solid var(--navy); border-radius:16px; padding:.2rem 1rem; margin:1rem 0; }
summary { cursor:pointer; font-weight:700; padding:.65rem 0; }

/* Γονέας */
.metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.9rem; margin:1rem 0; }
.metric { border:2px solid var(--navy); background:#fff; border-radius:16px; padding:.7rem 1rem; }
.metric .k { font-size:.92rem; color:var(--ink2); }
.metric .v { font-size:1.9rem; font-weight:800; }
table { width:100%; border-collapse:collapse; background:#fff; font-size:1rem; }
th, td { text-align:left; padding:.55rem .6rem; border-bottom:1px solid var(--line); vertical-align:middle; }
th { background:var(--soft); font-weight:700; }
.tablewrap { overflow-x:auto; border:2px solid var(--navy); border-radius:14px; }
.chart { display:flex; align-items:flex-end; gap:.5rem; height:170px; padding:.5rem .3rem 0; border-bottom:2px solid var(--navy); margin:.6rem 0 0; }
.chart .col { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; min-width:0; }
.chart .col span { font-size:.8rem; }
.chart .col div { width:70%; max-width:42px; background:var(--navy); border-radius:4px 4px 0 0; min-height:2px; }
.chartlabels { display:flex; gap:.5rem; padding:0 .3rem; font-size:.8rem; color:var(--ink2); }
.chartlabels span { flex:1; text-align:center; }
.banner { border:2px solid var(--navy); border-left-width:8px; background:#fff; border-radius:12px; padding:.7rem 1rem; margin:.8rem 0; }
.banner.error { border-left-color:#C2410C; }
.banner ul { margin:.4rem 0 0; padding-left:1.2rem; }
.check-row { display:flex; align-items:center; gap:.6rem; margin:.8rem 0; font-weight:700; }
.check-row input { width:1.3rem; height:1.3rem; accent-color:var(--navy); }
@media (max-width:640px) { .bar { display:none; } .title { font-size:1.65rem; } .prompt { font-size:1.4rem; } .opt { font-size:1.2rem; }
  .logo { width:46px; height:46px; } th, td { padding:.5rem .35rem; font-size:.95rem; } th { font-size:.88rem; } .bigscore { font-size:2.7rem; } }
.bar { display:inline-block; vertical-align:middle; width:90px; height:10px; background:var(--soft); border-radius:5px; overflow:hidden; margin-right:.5rem; }
.bar > i { display:block; height:100%; background:var(--navy); }
@media (max-width:380px) { th, td { font-size:.8rem; padding:.45rem .2rem; } th { font-size:.75rem; } main { padding-left:.8rem; padding-right:.8rem; } }
</style>
</head>
<body>
<main id="app"><noscript><p>Η εφαρμογή χρειάζεται JavaScript για να λειτουργήσει.</p></noscript></main>
<script src="questions.js"></script>
<script>
"use strict";
(function () {
  // ------------------------------------------------------------------
  // Σταθερές
  // ------------------------------------------------------------------
  var KEY = "mathapp.v2", MAX_NAME = 30, MAX_PROMPT = 300, MAX_OPTION = 80, MAX_EXPL = 400, MAX_TITLE = 40;
  var LETTERS = ["Α", "Β", "Γ", "Δ"];
  var TINTS = ["#BDE0FE", "#FFD6A5", "#CDEAC0", "#E4D4FF", "#FFC8DD", "#FDF0A6", "#B9F0E6", "#FFD0C2"];

  // ------------------------------------------------------------------
  // Βοηθητικές συναρτήσεις
  // ------------------------------------------------------------------
  function h(tag, props) {
    var el = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else if (k === "disabled" || k === "checked" || k === "value" || k === "selected" || k === "hidden") el[k] = v;
      else el.setAttribute(k, v === true ? "" : v);
    });
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, kid) {
    if (kid === null || kid === undefined || kid === false) return;
    if (Array.isArray(kid)) kid.forEach(function (k) { append(el, k); });
    else if (typeof kid === "string" || typeof kid === "number") el.appendChild(document.createTextNode(String(kid)));
    else el.appendChild(kid);
  }
  function svg(tag, attrs) {
    var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) if (arguments[i]) el.appendChild(arguments[i]);
    return el;
  }
  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }
  function nowIso() { return new Date().toISOString(); }
  function percentOf(part, whole) { return whole > 0 ? Math.floor(100 * part / whole + 0.5) : 0; }
  function stripMarks(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  function normKey(s) { return stripMarks(s).toUpperCase().replace(/\s+/g, " ").trim(); }
  function nameKey(name) { return stripMarks(name).toLowerCase().replace(/ς/g, "σ").replace(/\s+/g, " ").trim(); }
  function cleanName(name) { return String(name).replace(/\s+/g, " ").trim(); }
  function isInt(n) { return typeof n === "number" && isFinite(n) && Math.floor(n) === n && n >= 0; }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function hashStr(s) {
    var x = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 0x01000193) >>> 0; }
    return ("00000000" + x.toString(16)).slice(-8);
  }
  function fmtDate(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "—";
    return d.toLocaleString("el-GR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }
  function fmtDay(iso) {
    var d = new Date(iso);
    return isNaN(d.getTime()) ? "—" : d.toLocaleDateString("el-GR", { day: "2-digit", month: "2-digit", year: "numeric" });
  }
  function snip(s) { return s.length > 50 ? s.slice(0, 50) + "…" : s; }

  // ------------------------------------------------------------------
  // Ανάγνωση του αρχείου ερωτήσεων (questions.js)
  // ------------------------------------------------------------------
  function parseBank(text) {
    var res = { grade: "", set: "", topics: [], errors: [], warnings: [] };
    var lines = String(text).replace(/\r\n?/g, "\n").split("\n");
    var topic = null, block = "practice", q = null, last = null, titles = {};
    function err(msg) { res.errors.push(msg); }

    function closeQ() {
      if (!q) return;
      var where = "Ενότητα «" + topic.title + "», " + (q.block === "test" ? "Τεστάκι, " : "") + "ερώτηση " + q.no + ": ";
      var bad = [];
      if (!q.prompt.trim()) bad.push("λείπει η εκφώνηση (γραμμή που αρχίζει με ?)");
      else if (q.prompt.length > MAX_PROMPT) bad.push("η εκφώνηση είναι πολύ μεγάλη (πάνω από " + MAX_PROMPT + " χαρακτήρες)");
      var n = q.options.length;
      if (n < 2 || n > 4) bad.push("χρειάζονται 2 έως 4 απαντήσεις (έχει " + n + ")");
      if (q.correctIdx.length === 0) bad.push("δεν έχει σωστή απάντηση (βάλε * μπροστά από τη σωστή)");
      if (q.correctIdx.length > 1) bad.push("έχει περισσότερες από μία σωστές απαντήσεις (μόνο μία γραμμή να αρχίζει με *)");
      var seen = {};
      q.options.forEach(function (o, i) {
        var t = o.trim();
        if (!t) bad.push("η απάντηση " + (i + 1) + " είναι κενή");
        else if (t.length > MAX_OPTION) bad.push("η απάντηση «" + snip(t) + "» είναι πολύ μεγάλη (πάνω από " + MAX_OPTION + " χαρακτήρες)");
        var key = t.toLowerCase();
        if (t && seen[key]) bad.push("η απάντηση «" + snip(t) + "» υπάρχει δύο φορές");
        seen[key] = true;
      });
      if (q.explanation === null || !q.explanation.trim()) bad.push("λείπει η εξήγηση (γραμμή που αρχίζει με !)");
      else if (q.explanation.length > MAX_EXPL) bad.push("η εξήγηση είναι πολύ μεγάλη (πάνω από " + MAX_EXPL + " χαρακτήρες)");
      if (bad.length) bad.forEach(function (b) { err(where + b); });
      else topic[q.block].push({ prompt: q.prompt.trim(), options: q.options.map(function (o) { return o.trim(); }),
        correct: q.correctIdx[0], explanation: q.explanation.trim() });
      q = null; last = null;
    }

    for (var i = 0; i < lines.length; i++) {
      var t = lines[i].trim();
      if (!t || t.charAt(0) === "#") continue;
      var m = /^(==|--|\?|\*|-|!)(?:\s+(.*))?$/.exec(t);
      if (!topic && !(m && m[1] === "==")) {
        var mm = /^([^:]{1,12}):\s*(.*)$/.exec(t), k = mm ? normKey(mm[1]) : "";
        if (k === "ΤΑΞΗ") res.grade = mm[2].trim();
        else if (k === "ΣΕΤ") res.set = mm[2].trim();
        else err("Η γραμμή «" + snip(t) + "» βρίσκεται πριν από την πρώτη ενότητα. Κάθε ενότητα ξεκινά με «== Όνομα ενότητας».");
        continue;
      }
      if (!m) {
        if (q && last) {
          if (last === "prompt") q.prompt += " " + t;
          else if (last === "opt") q.options[q.options.length - 1] += " " + t;
          else q.explanation += " " + t;
        } else err("Ενότητα «" + topic.title + "»: η γραμμή «" + snip(t) + "» δεν ανήκει σε ερώτηση (λείπει ένα από τα σύμβολα ?  *  -  ! στην αρχή;).");
        continue;
      }
      var mk = m[1], tx = (m[2] || "").trim();
      if (mk === "==") {
        closeQ();
        if (!tx) err("Υπάρχει γραμμή «==» χωρίς όνομα ενότητας.");
        else if (tx.length > MAX_TITLE) err("Το όνομα ενότητας «" + snip(tx) + "» είναι πολύ μεγάλο (πάνω από " + MAX_TITLE + " χαρακτήρες).");
        if (titles[normKey(tx)]) err("Η ενότητα «" + tx + "» υπάρχει δύο φορές.");
        titles[normKey(tx)] = true;
        topic = { title: tx || "(χωρίς όνομα)", practice: [], test: [], hasTest: false, count: { practice: 0, test: 0 } };
        res.topics.push(topic); block = "practice"; last = null;
      } else if (mk === "--") {
        closeQ(); var key = normKey(tx);
        if (key.indexOf("ΤΕΣΤ") >= 0) {
          if (topic.hasTest) err("Ενότητα «" + topic.title + "»: η γραμμή «-- Τεστάκι» υπάρχει δύο φορές.");
          topic.hasTest = true; block = "test";
        } else if (key.indexOf("ΕΞΑΣΚ") >= 0) {
          if (topic.practice.length || topic.hasTest) err("Ενότητα «" + topic.title + "»: η γραμμή «-- Εξάσκηση» πρέπει να είναι στην αρχή της ενότητας.");
          block = "practice";
        } else err("Ενότητα «" + topic.title + "»: άγνωστη γραμμή «-- " + snip(tx) + "». Επιτρέπονται μόνο «-- Εξάσκηση» και «-- Τεστάκι».");
        last = null;
      } else if (mk === "?") {
        closeQ();
        q = { prompt: tx, options: [], correctIdx: [], explanation: null, block: block, no: ++topic.count[block] };
        last = "prompt";
      } else if (mk === "*" || mk === "-") {
        if (!q) { err("Ενότητα «" + topic.title + "»: η απάντηση «" + snip(tx) + "» δεν έχει ερώτηση από πάνω (γραμμή με ?)."); continue; }
        if (q.explanation !== null) { err("Ενότητα «" + topic.title + "», ερώτηση " + q.no + ": οι απαντήσεις πρέπει να γράφονται πριν από την εξήγηση (!)."); continue; }
        if (mk === "*") q.correctIdx.push(q.options.length);
        q.options.push(tx); last = "opt";
      } else {
        if (!q) { err("Ενότητα «" + topic.title + "»: η εξήγηση «" + snip(tx) + "» δεν έχει ερώτηση από πάνω (γραμμή με ?)."); continue; }
        if (q.explanation !== null) { err("Ενότητα «" + topic.title + "», ερώτηση " + q.no + ": υπάρχουν δύο εξηγήσεις (!)."); continue; }
        q.explanation = tx; last = "exp";
      }
    }
    closeQ();

    if (!res.topics.length) err("Δεν βρέθηκε καμία ενότητα. Κάθε ενότητα ξεκινά με «== Όνομα ενότητας».");
    if (res.topics.length > 12) err("Οι ενότητες είναι πάρα πολλές (" + res.topics.length + "). Το μέγιστο είναι 12.");
    res.topics.forEach(function (tp, idx) {
      if (!tp.practice.length) err("Η ενότητα «" + tp.title + "» δεν έχει ερωτήσεις.");
      if (tp.hasTest && !tp.test.length) err("Η ενότητα «" + tp.title + "» έχει «-- Τεστάκι» αλλά καμία ερώτηση από κάτω.");
      if (tp.practice.length > 30 || tp.test.length > 30) err("Η ενότητα «" + tp.title + "» έχει πάνω από 30 ερωτήσεις.");
      if (tp.practice.length && tp.practice.length !== 10) res.warnings.push("Ενότητα «" + tp.title + "»: η Εξάσκηση έχει " + tp.practice.length + " ερωτήσεις (συνήθως 10).");
      if (tp.hasTest && tp.test.length && tp.test.length !== 10) res.warnings.push("Ενότητα «" + tp.title + "»: το Τεστάκι έχει " + tp.test.length + " ερωτήσεις (συνήθως 10).");
      ["practice", "test"].forEach(function (b) {
        var seen = {};
        tp[b].forEach(function (x) {
          if (seen[x.prompt]) res.warnings.push("Ενότητα «" + tp.title + "»: η ερώτηση «" + snip(x.prompt) + "» υπάρχει δύο φορές.");
          seen[x.prompt] = true;
        });
      });
      tp.testQs = tp.hasTest ? tp.test : tp.practice;
      tp.practiceQs = tp.practice;

    }

    if (!isPractice) {
      wrap.appendChild(h("details", null, h("summary", { text: "Δες τις απαντήσεις" }),
        h("ol", { class: "review" }, res.review.map(function (r) {
          var ok = r.a && r.a.ok;
          return h("li", null, h("div", { class: "q", text: r.q.prompt }),
            h("div", null, "Η απάντησή σου: " + (r.a ? r.q.options[r.a.c] : "—") + (ok ? " ✓" : "")),
            ok ? null : h("div", null, "Σωστή απάντηση: ", h("strong", { text: r.q.options[r.q.correct] })),
            ok ? null : h("div", { class: "muted", text: r.q.explanation }));
        }))));
    }

    if (isPractice) {
      wrap.appendChild(h("button", { type: "button", class: "btn primary block", id: "totest", text: "Δοκίμασε το Τεστάκι", onclick: function () { ui.run = startRun(profile, topic, "test"); render("#qtitle"); } }));
      if (res.wrong.length) wrap.appendChild(h("button", { type: "button", class: "btn block", id: "retrywrong", text: "Ξανά οι ερωτήσεις που θέλουν εξάσκηση (" + res.wrong.length + ")",
        onclick: function () { ui.run = makeRun(profile, topic, "practice", res.wrong, { retry: true }); render("#qtitle"); } }));
      wrap.appendChild(h("button", { type: "button", class: "btn block", id: "again", text: "Εξάσκηση ξανά από την αρχή", onclick: function () { ui.run = startRun(profile, topic, "practice"); render("#qtitle"); } }));
    } else {
      wrap.appendChild(h("button", { type: "button", class: "btn " + (res.wrong.length ? "primary " : "") + "block", id: "topractice", text: "Πήγαινε στην Εξάσκηση", onclick: function () { ui.run = startRun(profile, topic, "practice"); render("#qtitle"); } }));
      wrap.appendChild(h("button", { type: "button", class: "btn block", id: "again", text: "Ξανά το Τεστάκι", onclick: function () { ui.run = startRun(profile, topic, "test"); render("#qtitle"); } }));
    }
    wrap.appendChild(h("button", { type: "button", class: "btn block", id: "home", text: "Αρχική οθόνη", onclick: function () { ui.run = null; render(); } }));
    return wrap;
  }

  // ---------------- Γονέας ----------------
  function downloadBackup() {
    var blob = new Blob([JSON.stringify(store, null, 1)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var d = new Date(), pad = function (n) { return String(n).padStart(2, "0"); };
    var a = h("a", { href: url, download: "mathapp-proodos-" + d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + ".json" });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }
  function importFile(file) {
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { setFlash("error", "Το αρχείο είναι πολύ μεγάλο."); render(); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var raw = null;
      try { raw = JSON.parse(String(reader.result)); } catch (e) { setFlash("error", "Το αρχείο δεν είναι έγκυρο αρχείο προόδου."); render(); return; }
      var r = mergeImport(raw);
      if (r.error) setFlash("error", r.error);
      else setFlash("ok", "Η επαναφορά ολοκληρώθηκε: " + r.profiles + " νέα προφίλ και " + r.runs + " νέες καταχωρίσεις.");
      render();
    };
    reader.onerror = function () { setFlash("error", "Το αρχείο δεν μπόρεσε να διαβαστεί."); render(); };
    reader.readAsText(file);
  }
  function th(list) { return h("thead", null, h("tr", null, list.map(function (t) { return h("th", { scope: "col", text: t }); }))); }

  function parentView(profile) {
    var all = runsOf(profile.id), tests = runsOf(profile.id, "test"), practices = runsOf(profile.id, "practice");
    var wrap = h("section", null, h("h2", { text: "Πρόοδος: " + profile.name }));
    if (!all.length) {
      wrap.appendChild(h("p", { text: "Δεν υπάρχουν ακόμη ολοκληρωμένες εξασκήσεις ή τεστάκια. Όταν ολοκληρωθεί το πρώτο, η πρόοδος θα εμφανιστεί εδώ." }));
    } else {
      var avg = averagePercent(tests);
      wrap.appendChild(h("div", { class: "metrics" },
        h("div", { class: "metric" }, h("div", { class: "k", text: "Εξασκήσεις" }), h("div", { class: "v", text: practices.length })),
        h("div", { class: "metric" }, h("div", { class: "k", text: "Τεστάκια" }), h("div", { class: "v", text: tests.length })),
        h("div", { class: "metric" }, h("div", { class: "k", text: "Μέσο ποσοστό στα τεστάκια" }), h("div", { class: "v", text: avg === null ? "—" : avg + "%" })),
        h("div", { class: "metric" }, h("div", { class: "k", text: "Τελευταία δραστηριότητα" }), h("div", { class: "v", style: "font-size:1.3rem", text: fmtDay(all[0].completedAt) }))));

      if (tests.length) {
        var recent = tests.slice(0, 10).reverse();
        wrap.appendChild(h("h3", { text: "Πρόσφατα τεστάκια" }));
        wrap.appendChild(h("p", { class: "muted", text: "Τελευταία " + recent.length + ", από το παλαιότερο στο νεότερο (ποσοστό επιτυχίας)." }));
        wrap.appendChild(h("div", { class: "chart", role: "img", "aria-label": "Ποσοστά επιτυχίας: " + recent.map(function (t) { return percentOf(t.score, t.n) + "%"; }).join(", ") },
          recent.map(function (t) { var p = percentOf(t.score, t.n); return h("div", { class: "col" }, h("span", { text: p + "%" }), h("div", { style: "height:" + Math.max(p, 1) + "%" })); })));
        wrap.appendChild(h("div", { class: "chartlabels" }, recent.map(function (t, i) { return h("span", { text: String(i + 1) }); })));
      }

      wrap.appendChild(h("h3", { text: "Τεστάκια ανά ενότητα" }));
      var stats = {};
      tests.forEach(function (r) {
        var s = stats[r.topic] || (stats[r.topic] = { count: 0, sum: 0, last: null, lastAt: "" });
        s.count++; s.sum += 100 * r.score / r.n;
        if (r.completedAt >= s.lastAt) { s.lastAt = r.completedAt; s.last = percentOf(r.score, r.n); }
      });
      var titles = bank.topics.map(function (t) { return t.title; });
      Object.keys(stats).forEach(function (t) { if (titles.indexOf(t) < 0) titles.push(t); });
      wrap.appendChild(h("div", { class: "tablewrap" }, h("table", null, th(["Ενότητα", "Τεστάκια", "Μέσο", "Τελευταίο"]),
        h("tbody", null, titles.map(function (t) {
          var s = stats[t];
          if (!s) return h("tr", null, h("td", { text: t }), h("td", { colspan: "3", class: "muted", text: "Δεν έχει δοκιμαστεί ακόμα" }));
          var m = Math.floor(s.sum / s.count + 0.5);
          return h("tr", null, h("td", { text: t }), h("td", { text: s.count }),
            h("td", null, h("span", { class: "bar", "aria-hidden": "true" }, h("i", { style: "width:" + m + "%" })), m + "%"), h("td", { text: s.last + "%" }));
        })))));

      wrap.appendChild(h("h3", { text: "Ιστορικό" }));
      wrap.appendChild(h("div", { class: "tablewrap" }, h("table", null, th(["Ημερομηνία", "Ενότητα", "Είδος", "Σκορ"]),
        h("tbody", null, all.map(function (r) {
          return h("tr", null, h("td", { text: fmtDate(r.completedAt) }),
            h("td", null, r.topic, r.set ? h("div", { class: "muted", text: r.set }) : null),
            h("td", { text: r.mode === "test" ? "Τεστάκι" : "Εξάσκηση" }), h("td", { text: r.score + "/" + r.n + " (" + percentOf(r.score, r.n) + "%)" }));
        })))));
    }

    var fileInput = h("input", { type: "file", id: "importfile", accept: "application/json,.json", class: "sr", tabindex: "-1", onchange: function (e) { importFile(e.target.files[0]); } });
    wrap.appendChild(h("h3", { text: "Αντίγραφο ασφαλείας" }));
    wrap.appendChild(h("p", { class: "muted", text: "Η πρόοδος υπάρχει μόνο σε αυτόν τον browser και χάνεται αν καθαριστούν τα δεδομένα περιήγησης. Κατέβασε ένα αρχείο ως αντίγραφο ή για να μεταφέρεις την πρόοδο σε άλλη συσκευή. Περιέχει τα ψευδώνυμα και τα αποτελέσματα όλων των προφίλ, οπότε φύλαξέ το προσεκτικά." }));
    wrap.appendChild(h("button", { type: "button", class: "btn block", text: "Λήψη αρχείου προόδου", onclick: downloadBackup }));
    wrap.appendChild(h("button", { type: "button", class: "btn block", text: "Επαναφορά από αρχείο", onclick: function () { fileInput.click(); } }));
    wrap.appendChild(fileInput);

    var confirm = h("input", { type: "checkbox", id: "confirmdel", checked: ui.confirmDelete, onchange: function (e) { ui.confirmDelete = e.target.checked; } });
    wrap.appendChild(h("details", null, h("summary", { text: "Διαχείριση προφίλ" }),
      h("p", { text: "Η διαγραφή αφαιρεί το προφίλ και όλα τα αποτελέσματά του και δεν μπορεί να αναιρεθεί." }),
      h("div", { class: "check-row" }, confirm, h("label", { for: "confirmdel", text: "Επιβεβαιώνω ότι θέλω να διαγραφεί το προφίλ" })),
      h("button", { type: "button", class: "btn block", id: "deletebtn", text: "Διαγραφή προφίλ", onclick: function () {
        if (!ui.confirmDelete) { setFlash("error", "Τσέκαρε πρώτα το πλαίσιο επιβεβαίωσης."); render(); return; }
        if (removeProfile(profile.id)) { ui.confirmDelete = false; ui.profileId = null; ui.view = "student"; setFlash("ok", "Το προφίλ και τα αποτελέσματά του διαγράφηκαν."); }
        else setFlash("error", "Η αποθήκευση δεν είναι διαθέσιμη σε αυτόν τον browser.");
        render();
      } })));
    wrap.appendChild(h("p", { class: "muted" }, "Για όποιον διαχειρίζεται τη σελίδα: ",
      h("a", { href: "?check", text: "έλεγχος των ερωτήσεων" }), "."));
    return wrap;
  }

  // ---------------- Έλεγχος ερωτήσεων (?check) και σφάλματα ----------------
  function renderBankError(parsed) {
    var root = h("div", null, header(null),
      h("div", { class: "banner error", role: "alert" },
        h("strong", { text: "Κάτι δεν πάει καλά με τις ερωτήσεις." }),
        h("p", { style: "margin:.4rem 0 0", text: "Ενημέρωσε κάποιον μεγάλο, για να διορθωθεί το αρχείο questions.js." })),
      h("section", { class: "panel" }, h("h2", { text: "Για όποιον διαχειρίζεται τη σελίδα" }),
        h("p", { text: "Βρέθηκαν τα παρακάτω προβλήματα στο αρχείο questions.js:" }),
        h("ul", null, parsed.errors.slice(0, 40).map(function (e) { return h("li", { text: e }); })),
        parsed.errors.length > 40 ? h("p", { class: "muted", text: "…και άλλα " + (parsed.errors.length - 40) + "." }) : null));
    app.replaceChildren(root);
  }
  function renderMissing() {
    app.replaceChildren(h("div", null, header(null), h("div", { class: "banner error", role: "alert" },
      h("strong", { text: "Δεν φορτώθηκαν οι ερωτήσεις." }),
      h("p", { style: "margin:.4rem 0 0", text: "Το αρχείο questions.js λείπει, δεν βρίσκεται στον ίδιο φάκελο με το index.html ή έχει σφάλμα στην πρώτη ή στην τελευταία του γραμμή." }))));
  }
  function renderCheck(parsed) {
    var root = h("div", null, header(h("a", { class: "btn small", href: location.pathname, style: "text-decoration:none;display:inline-flex;align-items:center", text: "Στην εφαρμογή" })),
      h("h2", { text: "Έλεγχος ερωτήσεων" }));
    if (parsed.errors.length) {
      root.appendChild(h("div", { class: "banner error", role: "alert" }, h("strong", { text: "Βρέθηκαν " + parsed.errors.length + " προβλήματα. Η εφαρμογή δεν θα ανοίξει μέχρι να διορθωθούν:" }),
        h("ul", null, parsed.errors.map(function (e) { return h("li", { text: e }); }))));
    } else {
      var total = parsed.topics.reduce(function (a, t) { return a + t.practiceQs.length + (t.hasTest ? t.test.length : 0); }, 0);
      root.appendChild(h("div", { class: "banner" }, h("strong", { text: "Όλα εντάξει: " + parsed.topics.length + " ενότητες, " + total + " ερωτήσεις." }),
        parsed.grade || parsed.set ? h("div", { class: "muted", text: [parsed.grade, parsed.set].filter(Boolean).join(" · ") }) : null));
    }
    if (parsed.warnings.length) root.appendChild(h("div", { class: "banner" }, h("strong", { text: "Προσοχή (δεν εμποδίζουν τη λειτουργία):" }),
      h("ul", null, parsed.warnings.map(function (w) { return h("li", { text: w }); }))));
    parsed.topics.forEach(function (t) {
      function list(qs) {
        return h("ol", null, qs.map(function (x) {
          return h("li", null, x.prompt, h("ul", null, x.options.map(function (o, i) { return h("li", null, i === x.correct ? h("strong", { text: o + " ✓" }) : o); })),
            h("div", { class: "muted", text: x.explanation }));
        }));
      }
      var sum = t.title + " — Εξάσκηση: " + t.practice.length + (t.hasTest ? ", Τεστάκι: " + t.test.length : ", Τεστάκι: οι ίδιες ερωτήσεις");
      root.appendChild(h("details", null, h("summary", { text: sum }), h("h3", { text: "Εξάσκηση" }), list(t.practice),
        t.hasTest ? [h("h3", { text: "Τεστάκι" }), list(t.test)] : null));
    });
    app.replaceChildren(root);
  }

  // ------------------------------------------------------------------
  // Εκκίνηση (και έκθεση για αυτόματο έλεγχο: window.__mathapp)
  // ------------------------------------------------------------------
  loadStore();
  var CHECK = /[?&]check(?:[=&]|$)/.test(location.search);
  if (typeof window.QUESTIONS_TEXT !== "string") renderMissing();
  else {
    bank = parseBank(window.QUESTIONS_TEXT);
    if (CHECK) renderCheck(bank);
    else if (bank.errors.length) renderBankError(bank);
    else render();
  }
  window.__mathapp = { parseBank: parseBank, sanitize: sanitize, nameKey: nameKey, percentOf: percentOf, getRun: function () { return ui.run; }, getBank: function () { return bank; } };
})();
</script>
